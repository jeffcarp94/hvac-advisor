<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HVAC Advisor acknowledgement test</title>
<style>
  :root { color-scheme: light dark; font: 1rem system-ui; }
  main { max-width: 28rem; margin: 2rem auto; padding: 0 1rem; }
  label, output { display: block; margin-block: 1rem; }
  input, button { box-sizing: border-box; width: 100%; padding: .6rem; font: inherit; }
  output { overflow-wrap: anywhere; }
</style>
<main>
  <h1>Logging acknowledgement test</h1>
  <form>
    <label for="endpoint">Apps Script web app URL</label>
    <input id="endpoint" type="url" autocomplete="off" autocapitalize="off" required>
    <p><button type="submit">Send test request</button></p>
  </form>
  <output role="status"></output>
</main>
<script>
  const form = document.querySelector('form');
  const endpoint = document.querySelector('#endpoint');
  const button = document.querySelector('button');
  const status = document.querySelector('output');

  form.addEventListener('submit', async event => {
    event.preventDefault();
    const url = new URL(endpoint.value);
    if (url.origin !== 'https://script.google.com' ||
        !/^\/macros\/s\/[\w-]+\/exec$/.test(url.pathname) || url.search || url.hash) {
      status.textContent = 'Enter the deployed Apps Script URL ending in /exec.';
      return;
    }
    const eventId = crypto.randomUUID();
    button.disabled = true;
    status.textContent = 'Waiting for a reply…';
    try {
      const reply = await fetch(url, {
        method: 'POST',
        mode: 'cors',
        credentials: 'omit',
        redirect: 'follow',
        headers: {'Content-Type': 'text/plain'},
        body: JSON.stringify({type: 'hvac_ack_probe', event_id: eventId}),
        signal: AbortSignal.timeout(20000)
      });
      if (!reply.ok) {
        status.textContent = 'No confirmation. HTTP ' + reply.status + '.';
        return;
      }
      const data = await reply.json();
      const matched = data?.ok === true && data.event_id === eventId;
      status.textContent = matched
        ? 'Confirmed. The browser read the matching event ID ' + eventId + '.'
        : 'Unconfirmed. The response did not acknowledge event ID ' + eventId + '.';
    } catch (error) {
      const reason = error.name === 'TimeoutError' ? 'The request timed out.' :
        error instanceof SyntaxError ? 'The browser received a non-JSON response.' :
        'The browser could not read the response. Check deployment access and network connectivity.';
      status.textContent = 'Unconfirmed. ' + reason + ' Test event ID ' + eventId + '.';
    } finally {
      button.disabled = false;
    }
  });
</script>
</html>
